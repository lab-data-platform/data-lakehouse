# Emulador local da AWS (moto em modo servidor), para testar o lakehouse sem tocar na conta real.
# Subir: make local-up · Testar: make local-test · Derrubar: make local-down

services:
  moto:
    image: motoserver/moto:5.2.5
    container_name: data-lakehouse-moto
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 2s
      retries: 15
