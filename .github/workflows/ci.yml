name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (fmt, validate, test)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Verificar formatação
        run: terraform fmt -check -recursive -diff

      - name: Validar sintaxe
        run: make validate

      - name: Rodar testes
        run: make test

  local:
    name: Integração local (moto)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Subir o moto e simular o contrato do foundation
        run: make local-up

      - name: Aplicar no moto, conferir e destruir
        run: make local-test

      - name: Derrubar o moto
        if: always()
        run: make local-down

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Reaproveitar o cache dos hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Instalar o pre-commit
        run: pipx install pre-commit

      - name: Rodar os hooks em todos os arquivos
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,terraform_fmt
